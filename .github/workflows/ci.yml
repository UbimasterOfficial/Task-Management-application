name: CI - Lint, Test, Build and Scan

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read


jobs:
    quality:
        name: Code quality and tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: 24

            - name: Install backend dependencies
              run: npm install
              working-directory: backend

            - name: Lint backend code
              run: npm run lint
              working-directory: backend

            - name: Run backend tests
              run: npm test
              working-directory: backend

            - name: Install frontend dependencies
              run: npm install
              working-directory: frontend

            - name: Lint frontend
              run: npm run lint
              working-directory: frontend

            - name: Build frontend
              run: npm run build
              working-directory: frontend

    container:
        name: Build and scan Docker images
        runs-on: ubuntu-latest
        needs: quality

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Get short SHA
              run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

            - name: Build backend image
              run: docker build -t cloudtask-backend:$SHORT_SHA ./backend

            - name: Build frontend image
              run: docker build -t cloudtask-frontend:$SHORT_SHA ./frontend

            - name: Scan backend image with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: 'cloudtask-backend:${{ env.SHORT_SHA }}'
                format: table
                exit-code: '0'
                ignore-unfixed: true
                severity: CRITICAL,HIGH

            - name: Scan frontend image with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: 'cloudtask-frontend:${{ env.SHORT_SHA }}'
                format: table
                exit-code: '0'
                ignore-unfixed: true
                severity: CRITICAL,HIGH
